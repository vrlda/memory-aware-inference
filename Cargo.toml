[package]
name = "super-inference"
version = "0.1.0"
edition = "2021"
description = "Terminal benchmark harness for Super-Inference experiments"

[[bin]]
name = "si-bench"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dependencies]
memmap2 = "0.9"
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = "0.23.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
metal = "0.33"
